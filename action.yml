name: 'Writulos Auto-Docs'
description: 'Auto-generate markdown documentation for every changed code file, powered by Writulos.'
author: 'Writulos'

branding:
  icon: 'book-open'
  color: 'red'

inputs:
  github_token:
    description: 'GitHub token for committing docs and posting PR comments. Pass secrets.GITHUB_TOKEN.'
    required: true
  writulos_api_key:
    description: 'Your Writulos API key. Get it from writulos.com/dashboard/api-keys. Pass secrets.WRITULOS_API_KEY.'
    required: true
  file_extensions:
    description: 'Comma-separated list of file extensions to document (no dots).'
    required: false
    default: 'js,ts,jsx,tsx,py,java,go,rb'
  output_dir:
    description: 'Directory to write generated .md files into.'
    required: false
    default: 'docs'
  api_url:
    description: 'Writulos API endpoint. Override only if self-hosting.'
    required: false
    default: 'https://writulos.com/api/action-generate'

runs:
  using: 'node20'
  main: 'action/run.js'
